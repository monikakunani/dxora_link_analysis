# Render Blueprint: one-click deploy of the Docker image.
# Open https://render.com/deploy?repo=https://github.com/monikakunani/dxora_link_analysis
services:
  - type: web
    name: dxora-link-analysis
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # Render asks for the value at deploy time; never committed
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
